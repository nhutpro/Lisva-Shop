# Local development database only. Data lives in the named volume "lisva-pgdata".
services:
  db:
    image: postgres:16-alpine
    container_name: lisva-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lisva
      POSTGRES_PASSWORD: lisva_dev_password
      POSTGRES_DB: lisva
    ports:
      - "5432:5432"
    volumes:
      - lisva-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisva -d lisva"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lisva-pgdata:
